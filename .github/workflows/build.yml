name: build

on:
  push:
    branches: [master, develop]
    tags: ['release/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 21 is the compiler target; the other is the current JDK, so we
        # find out early when a new release breaks us.
        java: ['21', '25']

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      # Doclint is on in the POM, but #20 unbound the javadoc plugin from the
      # lifecycle to keep local builds fast, so "verify" never invokes it and
      # nothing enforced it. Its own step rather than another goal on the line
      # above, so that a Javadoc failure is distinguishable from a test
      # failure at a glance. Run on both JDKs because doclint is the JDK's,
      # and a newer one can be stricter.
      - name: Javadoc
        run: mvn --batch-mode javadoc:javadoc
